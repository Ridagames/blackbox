name: BLACKBOX PS4 Release

on:
  push:
    tags:
      - "blackbox-ps4-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, validate and publish FPKG
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Install pinned OpenOrbis v0.5.4 toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 python3-pil
          echo 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-updates main' | sudo tee /etc/apt/sources.list.d/focal-compat.list
          sudo apt-get update
          sudo apt-get install -y libssl1.1
          ARCHIVE="$RUNNER_TEMP/openorbis-v0.5.4.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            --output "$ARCHIVE"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openorbis-extract" "$RUNNER_TEMP/llvm-bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/openorbis-extract"
          TOOLCHAIN="$(find "$RUNNER_TEMP/openorbis-extract" -type f -name link.x -printf '%h\n' -quit)"
          test -n "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/linux/create-fself"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/llvm-bin/clang"
          ln -sf "$(command -v clang++-18)" "$RUNNER_TEMP/llvm-bin/clang++"
          ln -sf "$(command -v ld.lld-18)" "$RUNNER_TEMP/llvm-bin/ld.lld"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"
      - name: Compile and package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#blackbox-ps4-v}"
          test -n "$VERSION"
          cd ps4-port/app
          make clean
          make VERSION="$VERSION"

      - name: Validate and prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#blackbox-ps4-v}"
          PKG="$(find ps4-port/app -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG"
          test -s "$PKG"
          test -s ps4-port/app/eboot.bin
          test -s ps4-port/app/sce_sys/param.sfo
          test -s ps4-port/app/sce_sys/icon0.png
          test "$(od -An -tx1 -N4 "$PKG" | tr -d ' \n')" = "7f434e54"
          mv "$PKG" "ps4-port/app/BLACKBOX-PS4-$VERSION.pkg"
          sha256sum "ps4-port/app/BLACKBOX-PS4-$VERSION.pkg" > "ps4-port/app/BLACKBOX-PS4-$VERSION.sha256"
          ls -lh "ps4-port/app/BLACKBOX-PS4-$VERSION.pkg" "ps4-port/app/BLACKBOX-PS4-$VERSION.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BLACKBOX PS4 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ps4-port/app/BLACKBOX-PS4-*.pkg
            ps4-port/app/BLACKBOX-PS4-*.sha256
