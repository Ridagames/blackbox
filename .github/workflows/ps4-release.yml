name: BLACKBOX PS4 Release

on:
  push:
    tags:
      - "blackbox-ps4-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, validate and publish FPKG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Build and validate FPKG with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: |
            python3 -m pip install --quiet Pillow
            cd ps4-port/app
            VERSION="${GITHUB_REF_NAME#blackbox-ps4-v}"
            test -n "$VERSION"
            make clean
            make VERSION="$VERSION"
            PKG="$(find . -maxdepth 1 -type f -name '*.pkg' -print -quit)"
            test -n "$PKG"
            test -s "$PKG"
            test -s eboot.bin
            test -s sce_sys/param.sfo
            test -s sce_sys/icon0.png
            test "$(od -An -tx1 -N4 "$PKG" | tr -d ' \n')" = "7f434e54"
            mv "$PKG" "BLACKBOX-PS4-$VERSION.pkg"
            sha256sum "BLACKBOX-PS4-$VERSION.pkg" > "BLACKBOX-PS4-$VERSION.sha256"
            ls -lh "BLACKBOX-PS4-$VERSION.pkg" "BLACKBOX-PS4-$VERSION.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BLACKBOX PS4 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ps4-port/app/BLACKBOX-PS4-*.pkg
            ps4-port/app/BLACKBOX-PS4-*.sha256
