name: Analyze BlackBox host bridge and runtime globals
on:
  push:
    branches: [ps4-port]
    paths:
      - ".github/workflows/analyze-blackbox-host-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download original BlackBox filesystem
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs
          mkdir -p "$RUNNER_TEMP/bb" "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/root" "$RUNNER_TEMP/out"
          curl --fail --location --retry 5 --retry-all-errors "https://github.com/D3ATHLY/blackbox/releases/download/2.0.0/BlackBox.exfat" -o "$RUNNER_TEMP/bb/BlackBox.exfat"
          sudo mount -t exfat -o loop,ro "$RUNNER_TEMP/bb/BlackBox.exfat" "$RUNNER_TEMP/mnt"
          sudo cp -a "$RUNNER_TEMP/mnt/." "$RUNNER_TEMP/root/"
          sudo umount "$RUNNER_TEMP/mnt"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/root"
      - name: Recover original bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/root/eboot.bin" "$RUNNER_TEMP/out" <<'PY'
          import hashlib,pathlib,subprocess,sys
          data=pathlib.Path(sys.argv[1]).read_bytes(); out=pathlib.Path(sys.argv[2])
          expected=0x5d7a680
          prefixes=[b'(() =>',b'(()=>',b'((() =>',b'(()=>{',b'(()=> {']
          starts=[]
          for prefix in prefixes:
              p=0
              while True:
                  p=data.find(prefix,p)
                  if p<0: break
                  if p>1024*1024: starts.append((p,prefix))
                  p+=1
          endings=[b'})();',b'})();\n',b'})();\r\n',b'})();\n;',b'})();\r\n;']
          candidates=[]
          for start,prefix in sorted(set(starts)):
              if start>expected+32*1024*1024: continue
              for marker in endings:
                  pos=start+1024*1024
                  while True:
                      pos=data.find(marker,pos)
                      if pos<0: break
                      end=pos+len(marker)
                      if end-start<=32*1024*1024: candidates.append((start,end,prefix,marker))
                      pos+=1
          candidates=sorted(set(candidates),key=lambda x:(x[1]-x[0],x[0]))
          target=out/'app.jsx.bundle.js'
          for count,(start,end,prefix,marker) in enumerate(candidates[:10000],1):
              target.write_bytes(data[start:end])
              q=subprocess.run(['node','--check',str(target)],capture_output=True,text=True,timeout=20)
              if q.returncode==0:
                  (out/'BUNDLE-REPORT.txt').write_text(f'start=0x{start:x}\nend=0x{end:x}\nsize={end-start}\nsha256={hashlib.sha256(data[start:end]).hexdigest()}\nnode_check=PASS\n')
                  print(f'Validated bundle: {end-start} bytes; sha256={hashlib.sha256(data[start:end]).hexdigest()}')
                  break
          else: raise SystemExit('No JavaScript candidate passed syntax validation')
          PY
      - name: Scan runtime globals, native bridges and host APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/out/app.jsx.bundle.js" "$RUNNER_TEMP/out" <<'PY'
          import pathlib,re,collections,hashlib,sys
          p=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); s=p.read_text(errors='replace')
          patterns={
            'native and bridge words':r'(?i).{0,220}(?:native|bridge|messageHandlers|postMessage|sendMessage|invokeNative|callNative|dispatchNative|hostApi|hostAPI).{0,260}',
            'browser and global objects':r'(?i).{0,180}(?:window\.|globalThis\.|navigator\.|document\.|webkit\.|process\.|require\().{0,240}',
            'console and platform APIs':r'(?i).{0,180}(?:PlayStation|PS5|PS4|Sce[A-Z][A-Za-z0-9_]*|sce[A-Z][A-Za-z0-9_]*|orbis|prospero).{0,240}',
            'media and animation APIs':r'(?i).{0,160}(?:AudioContext|HTMLAudioElement|\.play\(|\.pause\(|requestAnimationFrame|lottie|\.mp3|\.ogg|\.wav|\.mp4).{0,220}',
            'asset and filesystem APIs':r'(?i).{0,160}(?:fetch\(|XMLHttpRequest|localStorage|sessionStorage|indexedDB|\.json|\.png|\.jpg|\.webp|\.dds|\.ttf|\.otf).{0,220}'
          }
          lines=['# BlackBox host bridge reconnaissance v2','',f'Bundle bytes: {p.stat().st_size}',f'Bundle SHA-256: {hashlib.sha256(p.read_bytes()).hexdigest()}','']
          for title,pat in patterns.items():
              hits=[]
              for m in re.finditer(pat,s):
                  v=re.sub(r'\s+',' ',m.group(0)).strip()
                  if v not in hits: hits.append(v)
                  if len(hits)>=350: break
              lines += [f'## {title} ({len(hits)} unique samples)','']+[f'- `{x[:600]}`' for x in hits]+['']
              print(f'{title}: {len(hits)} samples')
          # Extract property names on common host objects.
          for obj in ['window','globalThis','navigator','document','webkit','process','NativeUI','nativeUI']:
              c=collections.Counter(re.findall(r'(?<![\w$])'+re.escape(obj)+r'\s*(?:\?\.)?\.\s*([A-Za-z_$][\w$]*)',s))
              lines += [f'## Properties accessed on {obj}','']+[f'- `{k}`: {v}' for k,v in c.most_common(250)]+['']
              print(obj, c.most_common(40))
          # Show bounded source windows around all likely bridge terms.
          terms=['NativeUI','nativeUI','native','bridge','messageHandlers','postMessage','sendMessage','invokeNative','callNative','PlayStation','PS5','Sce']
          windows=[]
          for term in terms:
              pos=0
              while True:
                  pos=s.find(term,pos)
                  if pos<0: break
                  a=max(0,pos-700); b=min(len(s),pos+1100)
                  windows.append((pos,term,re.sub(r'\s+',' ',s[a:b])))
                  pos+=len(term)
          windows.sort()
          seen=set(); selected=[]
          for pos,term,v in windows:
              key=(term,v)
              if key not in seen:
                  seen.add(key); selected.append((pos,term,v))
              if len(selected)>=500: break
          lines += ['## Full context windows (deduplicated)','']+[f'### offset 0x{pos:x} — {term}\n\n`{v[:1800]}`\n' for pos,term,v in selected]
          (out/'HOST-BRIDGE-RECONNAISSANCE-V2.md').write_text('\n'.join(lines)+'\n')
          (out/'HOST-BRIDGE-SCAN-SUMMARY.txt').write_text(f'bundle_bytes={p.stat().st_size}\nbundle_sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\ncontext_windows={len(selected)}\n')
          PY
      - name: Upload bridge analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-HOST-BRIDGE-ANALYSIS
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
