name: Deep inspect original BlackBox executables
on:
  push:
    branches: [ps4-port]
    paths:
      - ".github/workflows/inspect-blackbox-executables.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download and extract official BlackBox filesystem
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs file binutils binwalk 7zip ffmpeg python3 lrzip lz4 xz-utils
          mkdir -p "$RUNNER_TEMP/bb" "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/extracted" "$RUNNER_TEMP/analysis"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "https://github.com/D3ATHLY/blackbox/releases/download/2.0.0/BlackBox.exfat" \
            -o "$RUNNER_TEMP/bb/BlackBox.exfat"
          sudo mount -t exfat -o loop,ro "$RUNNER_TEMP/bb/BlackBox.exfat" "$RUNNER_TEMP/mnt"
          sudo cp -a "$RUNNER_TEMP/mnt/." "$RUNNER_TEMP/extracted/"
          sudo umount "$RUNNER_TEMP/mnt"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/extracted"
      - name: Inspect ELF structure, strings and embedded file signatures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted"
          OUT="$RUNNER_TEMP/analysis"
          find "$ROOT" -type f \( -name '*.elf' -o -name 'eboot.bin' -o -name '*.prx' \) -print0 | while IFS= read -r -d '' f; do
            rel="${f#"$ROOT"/}"
            safe="$(printf '%s' "$rel" | tr '/ ' '__')"
            {
              echo "FILE: $rel"
              echo "SIZE: $(stat -c %s "$f")"
              file "$f"
              readelf -h -l -S "$f" 2>&1 || true
              readelf -d -s "$f" 2>&1 | head -n 1200 || true
              strings -a -n 5 "$f" | grep -Ei 'audio|sound|music|ogg|opus|mp3|wav|flac|video|webm|mp4|jpeg|png|dds|texture|sprite|animation|\\.json|\\.js|\\.css|\\.html|font|shader|\\.prx|sce[A-Z_]' | head -n 2500 || true
            } > "$OUT/$safe.txt"
            if [ "$(basename "$f")" = "eboot.bin" ]; then
              binwalk "$f" > "$OUT/eboot-binwalk.txt" 2>&1 || true
              binwalk -E "$f" > "$OUT/eboot-entropy.txt" 2>&1 || true
            fi
          done
      - name: Map executable sections and search bundled app code
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted"
          OUT="$RUNNER_TEMP/analysis"
          mkdir -p "$OUT/section-dumps"
          python3 - "$ROOT" "$OUT" <<'PY'
          import os, re, sys, subprocess, pathlib
          root, out = sys.argv[1:3]
          report = pathlib.Path(out) / "SECTION-MAP-AND-APP-CODE.txt"
          targets = []
          for base, _, files in os.walk(root):
              for name in files:
                  if name == "eboot.bin" or name.endswith((".elf", ".prx")):
                      targets.append(os.path.join(base, name))
          needles = re.compile(rb"(?i)(quickjs|react|webpack|rollup|vite|sourceMappingURL|module\\.exports|exports\\.|createElement|\\.jsx?|\\.css|\\.html|\\.wasm|base64|data:audio|data:image|\\.mp3|\\.ogg|\\.opus|\\.wav|\\.webm|\\.mp4)")
          with report.open("w", encoding="utf-8") as w:
              for path in sorted(targets):
                  rel = os.path.relpath(path, root)
                  w.write(f"\\n===== {rel} ({os.path.getsize(path)} bytes) =====\\n")
                  if path.endswith((".elf", ".prx")) or os.path.basename(path) == "eboot.bin":
                      p = subprocess.run(["readelf", "-SW", path], capture_output=True, text=True)
                      w.write(p.stdout[:50000] if p.stdout else p.stderr[:5000])
                  data = pathlib.Path(path).read_bytes()
                  hits = list(needles.finditer(data))
                  w.write(f"\\nAPP/MEDIA STRING MATCHES: {len(hits)}\\n")
                  for m in hits[:500]:
                      a, b = max(0, m.start()-100), min(len(data), m.end()+180)
                      snippet = data[a:b].replace(b"\\x00", b" ")
                      w.write(f"offset=0x{m.start():x} {snippet.decode('utf-8','replace')}\\n")
                  if path.endswith((".elf", ".prx")):
                      sec = subprocess.run(["readelf", "-SW", path], capture_output=True, text=True).stdout
                      for line in sec.splitlines():
                          m = re.search(r"\\[\\s*\\d+\\]\\s+(\\S+)\\s+\\S+\\s+\\S+\\s+([0-9a-fA-F]+)\\s+([0-9a-fA-F]+)", line)
                          if not m:
                              continue
                          name, off, size = m.group(1), int(m.group(2),16), int(m.group(3),16)
                          if name not in (".rodata", ".data", ".data.rel.ro", ".init_array") or not size or size > 64*1024*1024:
                              continue
                          dest = pathlib.Path(out) / "section-dumps" / (rel.replace("/", "__") + name.replace(".", "_") + ".bin")
                          dest.write_bytes(data[off:off+size])
                          w.write(f"SECTION_DUMP {name} offset=0x{off:x} size={size} path={dest.name}\\n")
          PY
      - name: Locate and extract original BlackBox JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted"
          OUT="$RUNNER_TEMP/analysis/original-app"
          mkdir -p "$OUT"
          python3 - "$ROOT/eboot.bin" "$OUT" <<'PY'
          import pathlib,sys,re,hashlib,subprocess,tempfile
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          data=src.read_bytes()
          hint=0x5d7ac00
          end_marker=b'})();\\n\\x00'
          end=data.find(end_marker,hint)
          if end < 0:
              raise SystemExit('Could not locate the verified JavaScript bundle ending')
          end += len(end_marker)-1
          window_start=max(0,hint-4*1024*1024)
          window=data[window_start:hint]
          signatures=[
              b'var __defProp = Object.defineProperty',
              b'var __getOwnPropNames = Object.getOwnPropertyNames',
              b'var __commonJS =',
              b'var __esm =',
              b'var __toESM =',
              b'var __toCommonJS =',
              b'(() => {',
              b'(function () {',
              b'(function(){'
          ]
          candidates=[]
          report=[]
          report.append(f'eboot_size={len(data)}')
          report.append(f'end_offset=0x{end:x}')
          report.append(f'end_marker={end_marker!r}')
          for sig in signatures:
              hits=[m.start()+window_start for m in re.finditer(re.escape(sig),window)]
              report.append(f'{sig.decode(errors="replace")}: '+', '.join(hex(x) for x in hits))
              candidates.extend(hits)
          # Try syntactically valid starts in ascending order, choosing the earliest complete wrapper.
          valid=[]
          for start in sorted(set(candidates)):
              if start >= end: continue
              payload=data[start:end]
              with tempfile.NamedTemporaryFile(suffix='.js') as tmp:
                  tmp.write(payload); tmp.flush()
                  p=subprocess.run(['node','--check',tmp.name],capture_output=True,text=True)
              report.append(f'node_check_start=0x{start:x} result={"PASS" if p.returncode==0 else "FAIL"}')
              if p.returncode==0:
                  valid.append((start,payload))
          if not valid:
              # Preserve the exact source region for further parser-aware boundary analysis.
              start=hint
              payload=data[start:end]
              (out/'BLACKBOX-APP-SOURCE-CANDIDATE.js').write_bytes(payload)
              report.append('STATUS=NO_COMPLETE_WRAPPER_START_FOUND')
              report.append(f'candidate_start=0x{start:x}')
          else:
              start,payload=valid[0]
              (out/'BLACKBOX-ORIGINAL-APP-BUNDLE.js').write_bytes(payload)
              report.append('STATUS=COMPLETE_JS_BUNDLE_EXTRACTED')
              report.append(f'bundle_start=0x{start:x}')
              report.append(f'bundle_size={len(payload)}')
              report.append(f'bundle_sha256={hashlib.sha256(payload).hexdigest()}')
          (out/'BUNDLE-EXTRACTION-REPORT.txt').write_text('\\n'.join(report)+'\\n')
          PY
          cat "$OUT/BUNDLE-EXTRACTION-REPORT.txt"
      - name: Validate embedded archive and video candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted"
          OUT="$RUNNER_TEMP/analysis/candidate-validation"
          BIN="$ROOT/eboot.bin"
          mkdir -p "$OUT"
          probe() {
            label="$1"; offset="$2"; count="$3"; target="$OUT/$label.bin"
            echo "===== $label at offset $offset =====" | tee -a "$OUT/VALIDATION.txt"
            dd if="$BIN" of="$target" iflag=skip_bytes,count_bytes skip="$offset" count="$count" status=none
            file "$target" | tee -a "$OUT/VALIDATION.txt"
            timeout 30 7z l -slt "$target" >> "$OUT/VALIDATION.txt" 2>&1 || true
            timeout 20 ffprobe -v error -show_format -show_streams "$target" >> "$OUT/VALIDATION.txt" 2>&1 || true
            echo | tee -a "$OUT/VALIDATION.txt"
          }
          probe lrzip-offset-26141197 26141197 33554432
          probe lz4-offset-26141416 26141416 33554432
          probe lz4-offset-26141424 26141424 33554432
          probe rar-offset-26215714 26215714 33554432
          probe rar-offset-26216240 26216240 33554432
          probe rar-offset-26227457 26227457 33554432
          probe zip-footer-offset-26259933 26259933 33554432
          probe xz-offset-29709065 29709065 33554432
          probe 7z-offset-29843420 29843420 33554432
          probe xz-offset-31192560 31192560 33554432
          probe rar-offset-31192567 31192567 33554432
          echo "===== Native decompressor checks =====" | tee -a "$OUT/VALIDATION.txt"
          for f in "$OUT"/*.bin; do
            case "$f" in
              *lrzip*) timeout 30 lrzip -t "$f" >> "$OUT/VALIDATION.txt" 2>&1 || true ;;
              *lz4*) timeout 30 lz4 -t "$f" >> "$OUT/VALIDATION.txt" 2>&1 || true ;;
              *xz*) timeout 30 xz -t "$f" >> "$OUT/VALIDATION.txt" 2>&1 || true ;;
            esac
          done
          cat "$OUT/VALIDATION.txt"
      - name: Build inspection report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted"; OUT="$RUNNER_TEMP/analysis"
          { echo "BLACKBOX EXECUTABLE DEEP INSPECTION"; date -u; find "$ROOT" -type f \( -name '*.elf' -o -name 'eboot.bin' -o -name '*.prx' \) -printf '%P | %s bytes\n' | sort; } > "$OUT/REPORT.txt"
          cat "$OUT/REPORT.txt"
      - name: Upload executable analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-EXECUTABLE-DEEP-ANALYSIS
          path: ${{ runner.temp }}/analysis/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
