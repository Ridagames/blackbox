name: Inspect official PS5 BlackBox binary

on:
  push:
    branches: [ps4-port]
    paths:
      - ".github/workflows/inspect-ps5-blackbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download official BlackBox.exfat release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blackbox-original" "$RUNNER_TEMP/blackbox-extracted" "$RUNNER_TEMP/blackbox-mount"
          URL="https://github.com/D3ATHLY/blackbox/releases/download/2.0.0/BlackBox.exfat"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            "$URL" --output "$RUNNER_TEMP/blackbox-original/BlackBox.exfat"
          test -s "$RUNNER_TEMP/blackbox-original/BlackBox.exfat"
          stat "$RUNNER_TEMP/blackbox-original/BlackBox.exfat"
          sha256sum "$RUNNER_TEMP/blackbox-original/BlackBox.exfat" | tee "$RUNNER_TEMP/BLACKBOX-SHA256.txt"

      - name: Install native EXFAT tools and inspect filesystem
        shell: bash
        run: |
          set +e
          BIN="$RUNNER_TEMP/blackbox-original/BlackBox.exfat"
          REPORT="$RUNNER_TEMP/BLACKBOX-ANALYSIS.txt"
          MOUNT="$RUNNER_TEMP/blackbox-mount"
          OUT="$RUNNER_TEMP/blackbox-extracted"
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs file
          {
            echo "BLACKBOX OFFICIAL PS5 EXFAT EXTRACTION"
            echo "======================================"
            date -u
            echo
            echo "== FILE DETAILS =="
            file "$BIN"
            stat "$BIN"
            sha256sum "$BIN"
            echo
            echo "== EXFAT FILESYSTEM CHECK (READ ONLY) =="
            fsck.exfat -n "$BIN" 2>&1
            echo "fsck_exit_code=$?"
            echo
            echo "== EXFAT VOLUME INFORMATION =="
            dump.exfat "$BIN" 2>&1
            echo "dump_exit_code=$?"
            echo
            echo "== MOUNT READ ONLY AND EXTRACT =="
          } > "$REPORT"
          sudo mount -t exfat -o loop,ro "$BIN" "$MOUNT" >> "$REPORT" 2>&1
          MOUNT_RC=$?
          echo "mount_exit_code=$MOUNT_RC" >> "$REPORT"
          if [ "$MOUNT_RC" -eq 0 ]; then
            echo "Mount successful. Copying original files..." | tee -a "$REPORT"
            sudo find "$MOUNT" -mindepth 1 -maxdepth 4 -printf '%y | %P | %s bytes\n' | sort >> "$REPORT"
            sudo cp -a "$MOUNT/." "$OUT/"
            sudo chown -R "$(id -u):$(id -g)" "$OUT"
            sudo umount "$MOUNT"
            echo "Extraction completed." >> "$REPORT"
          else
            echo "Native mount failed; no files were extracted." >> "$REPORT"
          fi
          {
            echo
            echo "== EXTRACTED FILE INVENTORY =="
            find "$OUT" -type f -printf '%P | %s bytes\n' | sort
            echo
            echo "== FILE COUNTS AND TOTAL SIZE =="
            find "$OUT" -type f | wc -l
            du -sh "$OUT"
            echo
            echo "== FILE TYPE SUMMARY =="
            find "$OUT" -type f -print0 | xargs -0 -r file
          } >> "$REPORT"
          echo "=== REPORT ==="
          cat "$REPORT"
          test "$MOUNT_RC" -eq 0

      - name: Build curated original resources archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/blackbox-extracted"
          PACK="$RUNNER_TEMP/BLACKBOX-ORIGINAL-RESOURCES"
          mkdir -p "$PACK"
          for item in data i18n fonts sce_sys notices; do
            if [ -d "$ROOT/$item" ]; then
              cp -a "$ROOT/$item" "$PACK/"
            fi
          done
          python3 - "$PACK" "$RUNNER_TEMP/BLACKBOX-ORIGINAL-RESOURCES/README.txt" <<'PY'
          import json, os, sys
          root, readme = sys.argv[1:]
          files = []
          ext = {}
          for base, _, names in os.walk(root):
              for name in names:
                  path = os.path.join(base, name)
                  rel = os.path.relpath(path, root)
                  files.append(rel)
                  suffix = os.path.splitext(name)[1].lower() or "[no extension]"
                  ext[suffix] = ext.get(suffix, 0) + 1
          pages = [p for p in files if p.startswith("data/pages/") and p.endswith(".json")]
          locales = [p for p in files if p.startswith("i18n/locales/") and p.endswith(".json")]
          lines = [
              "BLACKBOX — ORIGINAL RESOURCE EXTRACTION",
              "========================================",
              "",
              "This archive preserves original files extracted from the official BlackBox.exfat filesystem.",
              "Included directories: data/, i18n/, fonts/, sce_sys/, notices/.",
              "The native PS5 executable and the full EXFAT image are intentionally not duplicated here.",
              "",
              f"Total files: {len(files)}",
              f"Game page JSON files: {len(pages)}",
              f"Locale JSON files: {len(locales)}",
              "",
              "File counts by extension:"
          ]
          lines += [f"{k}: {v}" for k, v in sorted(ext.items())]
          lines += [
              "",
              "Note: catalog JSON files may contain remote image URLs rather than local image files.",
              "No media file is claimed as extracted unless it is present as a standalone file in this archive."
          ]
          with open(readme, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, zipfile
          root = "BLACKBOX-ORIGINAL-RESOURCES"
          target = "BLACKBOX-ORIGINAL-RESOURCES.zip"
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for base, _, files in os.walk(root):
                  for name in files:
                      path = os.path.join(base, name)
                      z.write(path, path)
          print(f"Created {target}: {os.path.getsize(target)} bytes")
          PY
          sha256sum "$RUNNER_TEMP/BLACKBOX-ORIGINAL-RESOURCES.zip" | tee "$RUNNER_TEMP/BLACKBOX-ORIGINAL-RESOURCES-SHA256.txt"

      - name: Upload original binary, full extraction, resource pack and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-PS5-EXTRACTED-ORIGINAL
          path: |
            ${{ runner.temp }}/blackbox-original/BlackBox.exfat
            ${{ runner.temp }}/BLACKBOX-SHA256.txt
            ${{ runner.temp }}/BLACKBOX-ANALYSIS.txt
            ${{ runner.temp }}/BLACKBOX-ORIGINAL-RESOURCES.zip
            ${{ runner.temp }}/BLACKBOX-ORIGINAL-RESOURCES-SHA256.txt
            ${{ runner.temp }}/blackbox-extracted/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
