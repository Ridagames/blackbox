name: BLACKBOX PS4 Build

concurrency:
  group: blackbox-ps4-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - "ps4-port/tools/**"
      - "ps4-port/tools/**"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    name: Compile native PS4 application and package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned OpenOrbis v0.5.4 toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 python3-pil
          echo 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu focal-updates main' | sudo tee /etc/apt/sources.list.d/focal-compat.list
          sudo apt-get update
          sudo apt-get install -y libssl1.1
          ARCHIVE="$RUNNER_TEMP/openorbis-v0.5.4.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            --output "$ARCHIVE"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openorbis-extract" "$RUNNER_TEMP/llvm-bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/openorbis-extract"
          TOOLCHAIN="$(find "$RUNNER_TEMP/openorbis-extract" -type f -name link.x -printf '%h\n' -quit)"
          test -n "$TOOLCHAIN"
          test -x "$TOOLCHAIN/bin/linux/create-fself"
          ln -sf "$(command -v clang-18)" "$RUNNER_TEMP/llvm-bin/clang"
          ln -sf "$(command -v clang++-18)" "$RUNNER_TEMP/llvm-bin/clang++"
          ln -sf "$(command -v ld.lld-18)" "$RUNNER_TEMP/llvm-bin/ld.lld"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/llvm-bin" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN/bin/linux" >> "$GITHUB_PATH"
      - name: Compile and package
        shell: bash
        run: |
          cd ps4-port/app
          make clean
          make

      - name: Capture GP4 packaging diagnostics
        if: always()
        shell: bash
        run: |
          cd ps4-port/app
          echo "=== WORKING TREE ==="
          find . -maxdepth 4 -type f -printf '%p (%s bytes)\\n' | sort
          echo "=== GENERATED GP4 ==="
          if test -f pkg.gp4; then
            sed -n '1,240p' pkg.gp4
            cp pkg.gp4 "$RUNNER_TEMP/BLACKBOX-diagnostic.gp4"
          else
            echo "pkg.gp4 was not generated"
          fi
          echo "=== MAKEFILE FILE LIST ==="
          grep -n -A3 -B2 'pkg.gp4:' Makefile
      - name: Upload GP4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-GP4-diagnostics
          path: |
            ${{ runner.temp }}/BLACKBOX-diagnostic.gp4
            ps4-port/app/pkg.gp4
          if-no-files-found: warn
          retention-days: 7
      - name: Validate FPKG structure
        shell: bash
        run: |
          PKG="$(find ps4-port/app -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG"
          test -s "$PKG"
          test -s ps4-port/app/eboot.bin
          test -s ps4-port/app/sce_sys/param.sfo
          test -s ps4-port/app/sce_sys/icon0.png
          test "$(od -An -tx1 -N4 "$PKG" | tr -d ' \n')" = "7f434e54"
          sha256sum "$PKG" > ps4-port/app/BLACKBOX-PS4.sha256
          ls -lh "$PKG" ps4-port/app/eboot.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-PS4-test-build
          path: |
            ps4-port/app/*.pkg
            ps4-port/app/BLACKBOX-PS4.sha256
          if-no-files-found: error
          retention-days: 14
