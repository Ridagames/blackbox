name: BLACKBOX PS4 Build

on:
  push:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    name: Compile native PS4 application and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with OpenOrbis v0.5.4
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: |
            python3 -m pip install --quiet Pillow
            cd ps4-port/app
            make clean
            make
            PKG="$(find . -maxdepth 1 -type f -name '*.pkg' -print -quit)"
            test -n "$PKG"
            test -s "$PKG"
            test -s eboot.bin
            test -s sce_sys/param.sfo
            test -s sce_sys/icon0.png
            test "$(od -An -tx1 -N4 "$PKG" | tr -d ' \n')" = "7f434e54"
            sha256sum "$PKG" > BLACKBOX-PS4.sha256
            echo "Validated package: $PKG"
            ls -lh "$PKG" eboot.bin sce_sys/param.sfo sce_sys/icon0.png

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-PS4-test-build
          path: |
            ps4-port/app/*.pkg
            ps4-port/app/BLACKBOX-PS4.sha256
          if-no-files-found: error
          retention-days: 14
