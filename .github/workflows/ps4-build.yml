name: BLACKBOX PS4 Build

on:
  push:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - ".github/workflows/ps4-build.yml"
  pull_request:
    branches: [ps4-port]
    paths:
      - "ps4-port/app/**"
      - ".github/workflows/ps4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    name: Compile native PS4 application and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with pinned OpenOrbis v0.5.4
        run: |
          docker run --rm --user 0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/ps4-port/app \
            openorbisofficial/toolchain:v0.5.4 \
            bash -lc 'apt-get update -qq && apt-get install -y -qq python3-pil && make clean && make'

      - name: Validate FPKG structure
        run: |
          PKG="$(find ps4-port/app -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG"
          test -s "$PKG"
          test -s ps4-port/app/eboot.bin
          test -s ps4-port/app/sce_sys/param.sfo
          test -s ps4-port/app/sce_sys/icon0.png
          test "$(od -An -tx1 -N4 "$PKG" | tr -d ' \n')" = "7f434e54"
          sha256sum "$PKG" > ps4-port/app/BLACKBOX-PS4.sha256
          ls -lh "$PKG" ps4-port/app/eboot.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX-PS4-test-build
          path: |
            ps4-port/app/*.pkg
            ps4-port/app/BLACKBOX-PS4.sha256
          if-no-files-found: error
          retention-days: 14
